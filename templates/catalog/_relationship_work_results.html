{% if query %}{% for candidate in works %}<label class="work-search-choice"><input type="radio" name="related_work" value="{{ candidate.pk }}"{% if selected_id == candidate.pk|stringformat:'s' %} checked{% endif %}><span><strong>{{ candidate.title }}</strong><small>{{ candidate.work_type.label }} · catalog ID {{ candidate.pk }}</small></span></label>{% empty %}<p class="helper">No other published works match “{{ query }}”.</p>{% endfor %}{% else %}<p class="helper">Start typing to find another work.</p>{% endif %}
