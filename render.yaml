databases:
  - name: open-media-atlas-db
    plan: basic-256mb
    databaseName: open_media_atlas
    user: open_media_atlas

services:
  - type: web
    name: open-media-atlas
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn oma.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-media-atlas-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

